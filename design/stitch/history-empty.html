<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary-fixed-dim": "#5ed9d3",
                        "surface-bright": "#f7fafb",
                        "error-container": "#ffdad6",
                        "on-tertiary-container": "#521b00",
                        "on-tertiary-fixed": "#360f00",
                        "surface-container-high": "#e5e9ea",
                        "on-secondary-container": "#406a67",
                        "surface-container-low": "#f1f4f5",
                        "primary-fixed": "#7df6ef",
                        "on-primary-fixed-variant": "#00504d",
                        "on-secondary": "#ffffff",
                        "primary-container": "#0ea5a0",
                        "surface-container": "#ebeeef",
                        "surface-variant": "#e0e3e4",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#974822",
                        "inverse-on-surface": "#eef1f2",
                        "on-background": "#181c1d",
                        "secondary-container": "#bce8e5",
                        "secondary-fixed-dim": "#a3cfcb",
                        "secondary-fixed": "#bfebe8",
                        "on-error": "#ffffff",
                        "on-primary-container": "#003331",
                        "on-tertiary-fixed-variant": "#78310c",
                        "on-error-container": "#93000a",
                        "background": "#f7fafb",
                        "primary": "#006a66",
                        "surface": "#f7fafb",
                        "on-primary": "#ffffff",
                        "on-surface": "#181c1d",
                        "on-surface-variant": "#3d4948",
                        "tertiary-fixed-dim": "#ffb597",
                        "outline": "#6d7a78",
                        "tertiary-fixed": "#ffdbcd",
                        "tertiary-container": "#d97b51",
                        "surface-tint": "#006a66",
                        "inverse-surface": "#2d3132",
                        "surface-dim": "#d7dadc",
                        "on-secondary-fixed": "#00201f",
                        "outline-variant": "#bcc9c8",
                        "surface-container-highest": "#e0e3e4",
                        "on-primary-fixed": "#00201f",
                        "on-secondary-fixed-variant": "#234d4b",
                        "secondary": "#3c6563",
                        "inverse-primary": "#5ed9d3"
                    },
                    fontFamily: {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .signature-gradient {
            background: linear-gradient(135deg, #006a66 0%, #0ea5a0 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 bg-surface/80 backdrop-blur-md px-4 h-16 flex items-center justify-between">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="menu">menu</span>
</button>
<h1 class="text-headline-md font-bold tracking-tight text-on-surface">MediPulse</h1>
</div>
<div class="flex items-center gap-2">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="account_circle">account_circle</span>
</button>
</div>
</header>
<!-- Main Content: Empty State "Clinical Sanctuary" -->
<main class="flex-1 flex flex-col items-center justify-center px-8 text-center">
<!-- Asymmetrical Hero Decorative Element -->
<div class="relative w-full max-w-sm mb-12">
<!-- Background Shape 1 -->
<div class="absolute -top-12 -left-8 w-48 h-48 bg-secondary-container/30 rounded-full blur-3xl"></div>
<!-- Background Shape 2 -->
<div class="absolute -bottom-8 -right-4 w-56 h-56 bg-primary-container/10 rounded-full blur-3xl"></div>
<!-- Central Icon Composition -->
<div class="relative z-10 flex flex-col items-center">
<div class="w-32 h-32 rounded-xl bg-surface-container-lowest flex items-center justify-center shadow-[0px_12px_24px_rgba(24,28,29,0.06)] transform -rotate-3 mb-6 border border-outline-variant/10">
<span class="material-symbols-outlined text-primary text-6xl" data-icon="history" style="font-variation-settings: 'wght' 300;">history</span>
</div>
<div class="absolute top-0 right-1/4 w-12 h-12 rounded-full signature-gradient flex items-center justify-center shadow-lg transform translate-x-12 -translate-y-4">
<span class="material-symbols-outlined text-on-primary text-2xl" data-icon="content_paste">content_paste</span>
</div>
</div>
</div>
<!-- Editorial Typography -->
<h2 class="text-headline-lg font-extrabold text-on-surface tracking-tight mb-3">No history yet</h2>
<p class="text-body-md text-on-surface-variant max-w-[280px] leading-relaxed opacity-80 mb-10">
            Once you start taking medications, they will appear here as a complete health record.
        </p>
<!-- Premium CTA Button -->
<button class="signature-gradient text-on-primary px-8 py-4 rounded-full font-bold shadow-xl shadow-primary/20 hover:scale-105 transition-transform flex items-center gap-3">
<span class="material-symbols-outlined" data-icon="add">add</span>
<span>Add First Dose</span>
</button>
<!-- Instructional Micro-card (Asymmetry/Bento Style) -->
<div class="mt-16 w-full max-w-xs p-6 bg-surface-container-low rounded-lg text-left border border-outline-variant/5">
<div class="flex items-start gap-4">
<div class="p-2 bg-primary-container/20 rounded-lg">
<span class="material-symbols-outlined text-primary text-xl" data-icon="lightbulb">lightbulb</span>
</div>
<div>
<span class="block text-label-sm font-bold tracking-widest text-primary mb-1">PRO TIP</span>
<p class="text-body-md text-on-surface-variant leading-snug">Enable notifications to never miss a scheduled medication.</p>
</div>
</div>
</div>
</main>
<!-- FAB -->
<div class="fixed bottom-24 right-6">
<button class="w-14 h-14 signature-gradient rounded-2xl flex items-center justify-center text-on-primary shadow-xl shadow-primary/25 hover:rotate-90 transition-transform duration-300">
<span class="material-symbols-outlined text-3xl" data-icon="add">add</span>
</button>
</div>
<!-- BottomNavBar -->
<nav class="sticky bottom-0 w-full bg-surface-container-lowest border-t border-outline-variant/10 px-6 py-3 flex justify-around items-center">
<button class="flex flex-col items-center gap-1 group">
<div class="px-5 py-1 rounded-full group-hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="home">home</span>
</div>
<span class="text-label-sm font-medium text-on-surface-variant">Home</span>
</button>
<button class="flex flex-col items-center gap-1 group">
<div class="px-5 py-1 rounded-full group-hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="medication">medication</span>
</div>
<span class="text-label-sm font-medium text-on-surface-variant">Medications</span>
</button>
<button class="flex flex-col items-center gap-1 group">
<div class="px-5 py-1 rounded-full bg-secondary-container text-on-secondary-container">
<span class="material-symbols-outlined" data-icon="history" style="font-variation-settings: 'FILL' 1;">history</span>
</div>
<span class="text-label-sm font-bold text-on-surface">History</span>
</button>
</nav>
<!-- BottomSheetHandle for potential interactions -->
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-12 h-1.5 bg-surface-variant rounded-full mb-1 opacity-20"></div>
</body></html>

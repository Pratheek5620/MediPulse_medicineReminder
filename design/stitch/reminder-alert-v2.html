<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, height=844, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reminder Alert (v2)</title>
  <!-- Google Fonts: Plus Jakarta Sans & Noto Sans Devanagari for Hindi rendering -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            hindi: ['"Noto Sans Devanagari"', '"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            alertBg: '#00504D',
            alertDeep: '#003E3B',
            primaryTeal: '#006A66',
            amberChipBg: '#FEF3C7',
            amberChipText: '#92400E',
            amberBorder: '#FDE68A',
          }
        }
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #00504D;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      user-select: none;
    }

    /* Subtle pulsing aura ring around the alarm icon/header */
    @keyframes gentlePulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.25;
      }
      50% {
        transform: scale(1.08);
        opacity: 0.45;
      }
    }
    .pulse-ring {
      animation: gentlePulse 3.5s ease-in-out infinite;
    }

    /* Accessibility tap states */
    .btn-active:active {
      transform: scale(0.98);
      transition: transform 0.1s ease;
    }
  </style>
</head>
<body class="w-[390px] min-h-[844px] bg-[#00504D] text-white flex flex-col justify-between relative mx-auto select-none overflow-y-auto">

  <!-- Ambient background glow elements -->
  <div class="absolute -top-16 -left-16 w-64 h-64 rounded-full bg-[#006A66] filter blur-3xl opacity-35 pointer-events-none"></div>
  <div class="absolute top-1/3 -right-20 w-72 h-72 rounded-full bg-[#0EA5A0] filter blur-3xl opacity-20 pointer-events-none"></div>

  <!-- Android System Status Bar (390px width) -->
  <header class="w-full pt-3 px-6 flex justify-between items-center z-10 text-white/90">
    <span class="text-sm font-semibold tracking-normal font-sans">8:30</span>
    <div class="flex items-center space-x-2">
      <!-- Signal -->
      <svg class="w-4 h-4 fill-current text-white/90" viewBox="0 0 24 24">
        <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z" opacity="0.2"/>
        <path d="M12 6c-3.31 0-6 2.69-6 6 0 1.48.54 2.84 1.44 3.9L12 19l4.56-3.1C17.46 14.84 18 13.48 18 12c0-3.31-2.69-6-6-6z"/>
      </svg>
      <!-- Battery -->
      <svg class="w-5 h-5 fill-current text-white/90" viewBox="0 0 24 24">
        <path d="M16 4h-2V2h-4v2H8C6.9 4 6 4.9 6 6v14c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H8V7h8v13z"/>
      </svg>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="w-full px-5 pt-3 pb-6 flex-1 flex flex-col justify-between z-10">

    <!-- Top Centred Header Section -->
    <section class="text-center flex flex-col items-center">
      <!-- Pulsing Bell Badge for clarity -->
      <div class="relative flex items-center justify-center mb-2">
        <div class="absolute w-12 h-12 rounded-full bg-white/10 pulse-ring"></div>
        <div class="w-10 h-10 rounded-full bg-white/15 flex items-center justify-center backdrop-blur-sm">
          <!-- Notification Bell icon -->
          <svg class="w-5 h-5 text-teal-100" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/>
          </svg>
        </div>
      </div>

      <!-- 8:30 pm Very Large (56sp bold white) -->
      <h1 class="text-[54px] leading-tight font-extrabold text-white tracking-tight drop-shadow-sm font-sans">
        8:30 <span class="text-3xl font-bold tracking-normal opacity-95">pm</span>
      </h1>

      <!-- English primary reminder prompt (18sp) -->
      <p class="text-[18px] font-semibold text-white/95 mt-1 tracking-tight">
        Time for your night medicine
      </p>

      <!-- Hindi line for senior native language comfort (17sp) -->
      <p class="text-[17px] font-medium text-emerald-100/90 mt-1 font-hindi tracking-normal">
        रात की दवा का समय
      </p>
    </section>

    <!-- Big White Rounded Card (24px radius, Aura Med style, high contrast) -->
    <article class="w-full bg-white rounded-[24px] shadow-2xl p-5 my-4 text-center flex flex-col items-center border border-white/40">
      
      <!-- Pill Visual Representation (Realistic illustration) -->
      <div class="w-36 h-20 flex items-center justify-center mb-1">
        <img 
          src="https://lh3.googleusercontent.com/aida/AEtjO1X7Z-2_93Je1fWLvBC5-vMoXw5BqTyIGF862JefEI0UJ-N61TYBvm2M8FOBCNYzGpi0rhyBVNgeWJ_ceoGL1L1dr5hLHcioEoOiHKtakIeIW4-TkeT1YJ-fmOdwgNvMq_syOS0uZNpHFGU9T25N9vTlRijuoqH853_cSq94g9jPsZTmOOIi0oQM65GzWhItVoLhUuLn58llptWk4gepcBhdAiR0s81YiHCA5u0cEmb5VEXUPlWtktp2V_Qt" 
          alt="Metformin 500 mg white scored tablet" 
          class="w-full h-full object-contain filter drop-shadow-md"
        />
      </div>

      <!-- Medicine Name (28sp bold, on-surface #191C1C) -->
      <h2 class="text-[26px] leading-snug font-bold text-[#191C1C] tracking-tight mt-1 font-sans">
        Metformin 500 mg
      </h2>

      <!-- Subtext: 1 white tablet · after food (16-18sp) -->
      <p class="text-[17px] font-semibold text-[#006A66] mt-1 flex items-center justify-center gap-1.5">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-[#006A66]"></span>
        <span>1 white tablet · after food</span>
      </p>

      <!-- Soft Amber Chip Instruction: Take it with or right after dinner -->
      <div class="w-full mt-3.5 px-3.5 py-2.5 bg-[#FEF3C7] rounded-xl flex items-center justify-center gap-2 border border-[#FDE68A]">
        <!-- Meal / Info icon -->
        <svg class="w-5 h-5 text-[#92400E] shrink-0" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
        </svg>
        <span class="text-[14.5px] font-bold text-[#92400E] leading-snug text-left">
          Take it with or right after dinner
        </span>
      </div>

      <!-- Doctor prescription context text (clear, high readability) -->
      <p class="text-[13.5px] font-medium text-[#4B5563] mt-3.5 leading-relaxed">
        Prescribed by <span class="font-bold text-[#1F2937]">Dr. R. Sharma</span> · <span class="font-semibold text-[#006A66] bg-teal-50 px-2 py-0.5 rounded-md">1-0-1 for 30 days</span>
      </p>
    </article>

    <!-- Bottom Actions Container -->
    <footer class="w-full flex flex-col items-center space-y-3">
      
      <!-- Primary Action: Full-width White Pill Button with Check Icon (64dp tall) -->
      <button 
        type="button"
        class="w-full h-[64px] bg-white hover:bg-slate-50 text-[#00504D] rounded-full font-bold text-[20px] flex items-center justify-center gap-3 shadow-lg btn-active transition-all cursor-pointer focus:outline-none focus:ring-4 focus:ring-white/40"
        aria-label="Confirm dose taken"
      >
        <!-- Circle Check Icon -->
        <span class="w-8 h-8 rounded-full bg-[#006A66] text-white flex items-center justify-center">
          <svg class="w-5 h-5 stroke-current stroke-[3] fill-none" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </span>
        <span class="tracking-tight">I've taken it</span>
      </button>

      <!-- Secondary Action Buttons: Outlined White Pill Buttons side by side (≥56dp tall) -->
      <div class="w-full grid grid-cols-2 gap-3">
        <!-- Snooze 10 min -->
        <button 
          type="button"
          class="w-full h-[56px] border-2 border-white/80 bg-white/5 hover:bg-white/15 text-white rounded-full font-semibold text-[17px] flex items-center justify-center gap-2 btn-active transition-all cursor-pointer focus:outline-none"
          aria-label="Snooze reminder for 10 minutes"
        >
          <!-- Clock / Snooze icon -->
          <svg class="w-5 h-5 text-white/90" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span>Snooze 10 min</span>
        </button>

        <!-- Skip button -->
        <button 
          type="button"
          class="w-full h-[56px] border-2 border-white/80 bg-white/5 hover:bg-white/15 text-white rounded-full font-semibold text-[17px] flex items-center justify-center gap-1.5 btn-active transition-all cursor-pointer focus:outline-none"
          aria-label="Skip this dose"
        >
          <!-- Close / Skip icon -->
          <svg class="w-5 h-5 text-white/90" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          <span>Skip</span>
        </button>
      </div>

      <!-- Underlined Assistance Link for Doctor Communication -->
      <div class="pt-2 pb-1 text-center">
        <a 
          href="#doctor" 
          class="text-[15.5px] font-semibold text-emerald-100 hover:text-white underline underline-offset-4 decoration-emerald-200/60 hover:decoration-white transition-colors inline-flex items-center gap-1.5"
        >
          <!-- Small medical cross or support icon -->
          <svg class="w-4 h-4 text-emerald-200" fill="currentColor" viewBox="0 0 24 24">
            <path d="M19 10.5h-5.5V5c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v5.5H5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5h5.5V19c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-5.5H19c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5z"/>
          </svg>
          Feeling unwell? Tell your doctor
        </a>
      </div>

      <!-- Android Home Bar indicator -->
      <div class="w-32 h-1 bg-white/40 rounded-full mx-auto mt-1"></div>
    </footer>

  </main>

</body>
</html>

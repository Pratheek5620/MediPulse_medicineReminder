<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary-fixed-dim": "#5ed9d3",
              "surface-bright": "#f7fafb",
              "error-container": "#ffdad6",
              "on-tertiary-container": "#521b00",
              "on-tertiary-fixed": "#360f00",
              "surface-container-high": "#e5e9ea",
              "on-secondary-container": "#406a67",
              "surface-container-low": "#f1f4f5",
              "primary-fixed": "#7df6ef",
              "on-primary-fixed-variant": "#00504d",
              "on-secondary": "#ffffff",
              "primary-container": "#0ea5a0",
              "surface-container": "#ebeeef",
              "surface-variant": "#e0e3e4",
              "error": "#ba1a1a",
              "surface-container-lowest": "#ffffff",
              "on-tertiary": "#ffffff",
              "tertiary": "#974822",
              "inverse-on-surface": "#eef1f2",
              "on-background": "#181c1d",
              "secondary-container": "#bce8e5",
              "secondary-fixed-dim": "#a3cfcb",
              "secondary-fixed": "#bfebe8",
              "on-error": "#ffffff",
              "on-primary-container": "#003331",
              "on-tertiary-fixed-variant": "#78310c",
              "on-error-container": "#93000a",
              "background": "#f7fafb",
              "primary": "#006a66",
              "surface": "#f7fafb",
              "on-primary": "#ffffff",
              "on-surface": "#181c1d",
              "on-surface-variant": "#3d4948",
              "tertiary-fixed-dim": "#ffb597",
              "outline": "#6d7a78",
              "tertiary-fixed": "#ffdbcd",
              "tertiary-container": "#d97b51",
              "surface-tint": "#006a66",
              "inverse-surface": "#2d3132",
              "surface-dim": "#d7dadc",
              "on-secondary-fixed": "#00201f",
              "outline-variant": "#bcc9c8",
              "surface-container-highest": "#e0e3e4",
              "on-primary-fixed": "#00201f",
              "on-secondary-fixed-variant": "#234d4b",
              "secondary": "#3c6563",
              "inverse-primary": "#5ed9d3"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Plus Jakarta Sans"],
              "label": ["Plus Jakarta Sans"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #f7fafb;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .signature-gradient {
        background: linear-gradient(135deg, #006a66 0%, #0ea5a0 100%);
      }
      .glass-card {
        background: rgba(247, 250, 251, 0.7);
        backdrop-filter: blur(20px);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background selection:bg-primary-fixed-dim">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 right-0 z-50 bg-surface h-16 flex items-center px-4">
<div class="flex items-center w-full max-w-5xl mx-auto">
<button class="w-12 h-12 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="ml-4 font-headline text-headline-md font-semibold text-on-surface">MediPulse</h1>
<div class="ml-auto">
<button class="w-12 h-12 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</div>
</div>
</header>
<!-- Main Content Area (The Clinical Sanctuary) -->
<main class="pt-24 pb-32 px-6 min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Background Decorative Elements (Asymmetry Principle) -->
<div class="absolute -top-20 -right-20 w-80 h-80 bg-secondary-container opacity-20 rounded-full blur-3xl"></div>
<div class="absolute bottom-40 -left-20 w-64 h-64 bg-primary-container opacity-10 rounded-full blur-3xl"></div>
<!-- Empty State Content -->
<div class="relative z-10 w-full max-w-md text-center">
<!-- Hero Icon Presentation (Tactile Depth) -->
<div class="mb-10 inline-flex items-center justify-center relative">
<div class="w-48 h-48 signature-gradient rounded-xl rotate-12 absolute opacity-10 scale-110"></div>
<div class="w-40 h-40 bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/10 flex items-center justify-center relative">
<span class="material-symbols-outlined text-[100px] text-primary-container" data-icon="medication" style="font-variation-settings: 'FILL' 1;">medication</span>
</div>
<!-- Asymmetric overlap element -->
<div class="absolute -bottom-4 -right-4 w-20 h-20 glass-card rounded-full flex items-center justify-center border border-white/40 shadow-xl">
<span class="material-symbols-outlined text-primary" data-icon="add">add</span>
</div>
</div>
<!-- Typography Hierarchy -->
<div class="space-y-4 mb-12">
<h2 class="font-headline text-headline-lg font-bold text-on-surface tracking-tight">No medications yet</h2>
<p class="font-body text-body-md text-on-surface-variant max-w-[280px] mx-auto leading-relaxed">
                    Add your first medication to get started and stay on top of your health journey.
                </p>
</div>
<!-- Primary Action (Pill Motif) -->
<button class="signature-gradient text-on-primary px-10 py-5 rounded-full font-headline font-semibold flex items-center justify-center mx-auto space-x-3 shadow-lg hover:brightness-110 transition-all active:scale-95 group">
<span class="material-symbols-outlined group-hover:rotate-90 transition-transform" data-icon="add">add</span>
<span class="tracking-wide">Add Medication</span>
</button>
</div>
<!-- Secondary Info (Breathing Room) -->
<div class="mt-16 w-full max-w-md">
<div class="bg-surface-container-low p-6 rounded-lg border border-outline-variant/5">
<div class="flex items-start space-x-4">
<div class="p-2 bg-surface-container-lowest rounded-lg">
<span class="material-symbols-outlined text-secondary" data-icon="lightbulb">lightbulb</span>
</div>
<div class="text-left">
<span class="font-label text-label-sm font-bold text-outline block mb-1 tracking-wider uppercase">Pro Tip</span>
<p class="font-body text-body-md text-on-surface-variant">Scanning your pill bottle label can automatically fill in the dosage details.</p>
</div>
</div>
</div>
</div>
</main>
<!-- FAB -->
<div class="fixed bottom-24 right-6 z-40">
<button class="w-14 h-14 signature-gradient rounded-full flex items-center justify-center text-on-primary shadow-[0px_12px_24px_rgba(24,28,29,0.12)] hover:scale-105 transition-transform active:scale-95">
<span class="material-symbols-outlined text-[28px]" data-icon="add">add</span>
</button>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 right-0 z-50 bg-surface-container-lowest border-t border-outline-variant/10 px-4 pb-2 pt-3 h-20">
<div class="max-w-md mx-auto flex items-center justify-between">
<a class="flex flex-col items-center flex-1 space-y-1 text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label text-[11px] font-medium tracking-wide">Home</span>
</a>
<a class="flex flex-col items-center flex-1 space-y-1 text-primary transition-colors relative" href="#">
<div class="absolute -top-3 w-12 h-1 bg-primary rounded-b-full"></div>
<span class="material-symbols-outlined" data-icon="medication" style="font-variation-settings: 'FILL' 1;">medication</span>
<span class="font-label text-[11px] font-bold tracking-wide">Medications</span>
</a>
<a class="flex flex-col items-center flex-1 space-y-1 text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-label text-[11px] font-medium tracking-wide">History</span>
</a>
</div>
</nav>
</body></html>
